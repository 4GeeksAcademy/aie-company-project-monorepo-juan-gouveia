[project]
name = "brasaland-api"
version = "0.1.0"
description = "API central de Brasaland (FastAPI)."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # Necesario para recibir archivos como multipart/form-data.
    "python-multipart>=0.0.9",
    # Almacenamiento ligero del directorio de proveedores (provisional hasta tener Postgres).
    "tinydb>=4.8",
    # EmailStr para el contacto de los proveedores.
    "pydantic[email]>=2.7",
]

[project.scripts]
# `uv run seed` carga los proveedores iniciales del briefing en TinyDB.
seed = "app.domains.suppliers.seed:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    # Lo usa el TestClient de FastAPI.
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
