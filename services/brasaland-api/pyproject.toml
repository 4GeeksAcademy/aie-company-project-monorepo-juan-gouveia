[project]
name = "brasaland-api"
version = "0.1.0"
description = "API central de Brasaland (FastAPI)."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # Necesario para recibir archivos como multipart/form-data.
    "python-multipart>=0.0.9",
    # Almacenamiento ligero del directorio de proveedores (provisional hasta tener Postgres).
    "tinydb>=4.8",
    # EmailStr para el contacto de los proveedores.
    "pydantic[email]>=2.7",
    # Firma y verificación de los tokens JWT de acceso.
    "python-jose[cryptography]>=3.5.0",
    # Hash de contraseñas con bcrypt. Fork mantenido de passlib: se importa como `passlib`.
    "libpass[bcrypt]>=1.9.4",
    "resend>=2.52.0",
    # Reglas del CSV de incidentes compartidas con los scripts (packages/shared).
    "brasaland-shared",
    # ORM del inventario (Hito 5): modelos y consultas sobre Supabase (PostgreSQL).
    "sqlmodel>=0.0.50",
    # Driver de PostgreSQL que usa SQLModel para conectarse a Supabase.
    "psycopg2-binary>=2.9.13",
]

[tool.uv.sources]
# Paquete local del monorepo, instalado en modo editable: los cambios se ven sin reinstalar.
brasaland-shared = { path = "../../packages/shared", editable = true }

[project.scripts]
# `uv run seed` carga los proveedores iniciales del briefing en TinyDB.
seed = "app.domains.suppliers.seed:main"
# `uv run create-admin` crea el primer administrador (POST /users siempre crea rol `user`).
create-admin = "app.domains.users.create_admin:run"
# `uv run --env-file .env seed-inventory` carga en Supabase los datos semilla del inventario (Hito 5).
seed-inventory = "app.domains.inventory.seed:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    # Lo usa el TestClient de FastAPI.
    "httpx>=0.27",
    # Cobertura: `uv run pytest --cov` (configuración en [tool.coverage.*]).
    "pytest-cov>=7.1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: pruebas HTTP con TestClient de tests/integration/ (contrato con el backoffice)",
]

[tool.coverage.run]
# `uv run pytest --cov` mide todo el código de la API, nunca las pruebas.
source = ["app"]

[tool.coverage.report]
# Líneas sin cubrir junto al porcentaje; los __init__.py vacíos no cuentan.
show_missing = true
skip_empty = true
