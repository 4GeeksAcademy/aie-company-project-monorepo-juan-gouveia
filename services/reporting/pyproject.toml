[project]
name = "brasaland-reporting"
version = "0.1.0"
description = "Endpoints de los reportes de negocio de Brasaland (/reporting), montados en brasaland-api."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.7",
    # La lectura de reporting.* y el disparo de corridas viven en data/pipelines: aquí solo hay HTTP.
    "brasaland-pipelines",
]

[tool.uv.sources]
brasaland-pipelines = { path = "../../data/pipelines", editable = true }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Esta carpeta es el paquete: services/reporting/router.py se importa como brasaland_reporting.router.
# Solo funciona montado en la API (app.main): usa sus errores, su autenticación, su base y su caché. La
# API lo instala en modo editable con uv, como services/telemetry.
[tool.setuptools]
package-dir = { "brasaland_reporting" = "." }
packages = ["brasaland_reporting"]
