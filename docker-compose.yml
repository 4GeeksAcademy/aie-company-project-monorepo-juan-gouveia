# Entorno de desarrollo de Brasaland (ticket #infra-40). Desde la raíz del repositorio:
#   cp .env.example .env    # una sola vez; rellena los secretos
#   docker compose up
# Servicios:
#   uis -> website en http://localhost:3000 y backoffice en http://localhost:3001 (next dev)
#   api -> API de Brasaland en http://localhost:8000 (Uvicorn con --reload; documentación en /docs)
#   prefect-server -> servidor de Prefect en http://localhost:4200 (interfaz y API del orquestador)
#   reporting-pipeline -> pipeline del Reporte Semanal de Costo y Merma por Local (pipeline.py --serve):
#     las corridas manuales que pide la API. Lee su conexión de data/pipelines/.env.
#   nightly-scheduler -> script nocturno de telemetría (#DEV-53): supercronic ejecuta cada día a las
#     08:00 UTC scripts/nightly_export.py (export del CSV y corrida programada del pipeline). Lee su
#     conexión de services/jobs/.env y la del pipeline de data/pipelines/.env.
#   redis -> broker y backend de resultados de la cola de tareas (#DEV-55), en localhost:6379 (solo en
#     este equipo: Redis de desarrollo sin contraseña).
# El código se monta desde el host (bind mounts): los cambios se ven sin reconstruir las imágenes.
# Las variables se leen del .env de la raíz y se interpolan aquí con ${VARIABLE}; ningún valor real
# vive en este archivo. Cada servicio recibe solo las variables que necesita.

name: brasaland

services:
  api:
    build:
      context: ./services
      dockerfile: Dockerfile
      # packages/shared está fuera de ./services: llega a la imagen como contexto adicional.
      additional_contexts:
        shared: ./packages/shared
        # data/process y data/pipelines (lectura de reporting.* y disparo de corridas) para services/reporting.
        data: ./data
    ports:
      - "8000:8000"
    volumes:
      - ./services/brasaland-api:/repo/services/brasaland-api
      - ./packages/shared:/repo/packages/shared
      - ./services/telemetry:/repo/services/telemetry
      - ./services/reporting:/repo/services/reporting
      - ./data/process:/repo/data/process
      - ./data/pipelines:/repo/data/pipelines
      # Oculta el .venv del host (Windows): la imagen usa su propio Python y el sondeo de la
      # recarga no tiene que recorrerlo.
      - /repo/services/brasaland-api/.venv
    environment:
      # Obligatorias: sin ellas, la API no arranca y Compose se detiene con este mensaje.
      SECRET_KEY: ${SECRET_KEY:?Falta SECRET_KEY en el .env de la raíz (copia .env.example a .env)}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:?Falta ACCESS_TOKEN_EXPIRE_MINUTES en el .env de la raíz}
      DATABASE_URL: ${DATABASE_URL:?Falta DATABASE_URL en el .env de la raíz (cadena de conexión de Supabase)}
      # Opcionales: vacías, la API usa sus valores por defecto.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      FRONTEND_URL: ${FRONTEND_URL:-}
      PASSWORD_RESET_EXPIRE_MINUTES: ${PASSWORD_RESET_EXPIRE_MINUTES:-}
      TELEMETRY_ENDPOINT: ${TELEMETRY_ENDPOINT:-}
      # POST /reporting/pipeline-runs pide las corridas manuales a este servidor de Prefect.
      PREFECT_API_URL: http://prefect-server:4200/api
      # Recarga en caliente por sondeo (los bind mounts no propagan los eventos de archivos).
      WATCHFILES_FORCE_POLLING: ${WATCHFILES_FORCE_POLLING:-true}
    healthcheck:
      # /health es pública y no toca la base de datos. La imagen no trae curl: se usa Python.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - brasaland-net

  uis:
    build:
      context: ./uis
      dockerfile: Dockerfile
      # packages/brasa-core está fuera de ./uis: llega a la imagen como contexto adicional.
      additional_contexts:
        brasa-core: ./packages/brasa-core
    ports:
      - "3000:3000"
      - "3001:3001"
    volumes:
      - ./uis:/repo/uis
      - ./packages/brasa-core:/repo/packages/brasa-core
      # node_modules y .next se quedan en el contenedor: los binarios de Linux no se mezclan con
      # los del host. Tras cambiar dependencias: docker compose up --build --renew-anon-volumes.
      - /repo/uis/website/node_modules
      - /repo/uis/backoffice/node_modules
      - /repo/uis/website/.next
      - /repo/uis/backoffice/.next
    environment:
      # El intermediario (BFF) del backoffice llama a la API de servidor a servidor, por el nombre
      # del servicio en la red Docker.
      API_BASE_URL: ${API_BASE_URL:-http://api:8000/api/v1}
      # La usa el navegador (tracker /talento): debe ser una URL accesible desde el host.
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-}
      NEXT_PUBLIC_TELEMETRY_ENDPOINT: ${NEXT_PUBLIC_TELEMETRY_ENDPOINT:-http://localhost:8000/telemetry/events}
      NEXT_PUBLIC_TELEMETRY_ENVIRONMENT: ${NEXT_PUBLIC_TELEMETRY_ENVIRONMENT:-development}
      # Recarga en caliente por sondeo (watchOptions.pollIntervalMs de next.config.ts, con webpack).
      NEXT_WATCH_POLL_INTERVAL_MS: ${NEXT_WATCH_POLL_INTERVAL_MS:-1000}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - brasaland-net

  prefect-server:
    # Misma versión que el cliente de data/pipelines/uv.lock.
    image: prefecthq/prefect:3.9.4-python3.12
    command: ["prefect", "server", "start", "--host", "0.0.0.0"]
    ports:
      - "4200:4200"
    environment:
      # La interfaz se abre desde el host.
      PREFECT_UI_API_URL: http://localhost:4200/api
    volumes:
      # Corridas, deployments y bloques sobreviven a un reinicio.
      - prefect-data:/root/.prefect
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - brasaland-net

  reporting-pipeline:
    build:
      context: ./data
      dockerfile: pipelines/Dockerfile
    volumes:
      # El código del host, y las salidas de cada corrida en data/raw y data/eval (fuera de Git).
      - ./data:/repo/data
      # Resultados cacheados de Prefect (la transformación y el catálogo de locales, 1 hora).
      - prefect-results:/home/brasaland/.prefect
    env_file:
      # REPORTING_DATABASE_URL: la cadena del rol reporting_pipeline (ver data/pipelines/.env.example).
      - path: ./data/pipelines/.env
        required: false
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
    depends_on:
      prefect-server:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - brasaland-net

  nightly-scheduler:
    # Disparador del script nocturno (#DEV-53): un contenedor dedicado, fuera del proceso de la API. La
    # expresión cron está en scripts/nightly_export.crontab (0 8 * * *, UTC).
    build:
      context: ./services
      dockerfile: jobs/Dockerfile
      additional_contexts:
        # data/pipelines y data/process: el pipeline que el script lanza como subproceso.
        data: ./data
        scripts: ./scripts
    volumes:
      # El código del host: el script, su crontab, job_runner y el pipeline.
      - ./services/jobs:/repo/services/jobs
      - ./scripts:/repo/scripts
      # También la salida: el CSV en data/raw/telemetry_exports y las del pipeline (fuera de Git).
      - ./data:/repo/data
      # Resultados cacheados de Prefect del pipeline, compartidos con reporting-pipeline.
      - prefect-results:/home/brasaland/.prefect
    env_file:
      # JOBS_DATABASE_URL: la cadena del rol nightly_jobs (ver services/jobs/.env.example).
      - path: ./services/jobs/.env
        required: false
      # REPORTING_DATABASE_URL: la del rol reporting_pipeline, para el subproceso del pipeline.
      - path: ./data/pipelines/.env
        required: false
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
    depends_on:
      prefect-server:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - brasaland-net

  redis:
    # Broker y backend de resultados de la cola de tareas (#DEV-55). La API (productor), el worker
    # (consumidor) y Flower se conectan aquí con REDIS_URL=redis://redis:6379/0.
    image: redis:8.10.3-alpine
    command:
      - redis-server
      # Los mensajes en cola sobreviven a un reinicio de Redis (AOF en el volumen).
      - --appendonly
      - "yes"
      # Sin memoria, Redis rechaza escrituras en vez de descartar claves: nunca borra mensajes ni resultados.
      - --maxmemory-policy
      - noeviction
    ports:
      # Puerto estándar, publicado solo en 127.0.0.1: es un Redis de desarrollo sin contraseña.
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - brasaland-net

networks:
  brasaland-net:
    name: brasaland-net

volumes:
  prefect-data:
  prefect-results:
  redis-data:
